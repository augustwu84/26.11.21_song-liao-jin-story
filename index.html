<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>26.11.21_銀兩君的時空帳本｜宋遼金互動動畫故事</title>
<style>
  :root{
    --ink:#2a1f17; --paper:#fbf3e2; --red:#b8322a; --gold:#d9a521; --jade:#2f7d6d; --sky:#cfe6f2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#1b1411;overflow:hidden;font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#000;transform-origin:center center;flex:none;border-radius:6px}
  .layer{position:absolute;inset:0}
  #bg svg{width:100%;height:100%;display:block}

  /* actors */
  .actor{position:absolute;bottom:170px;width:200px;height:300px;transition:left .6s ease, opacity .5s, transform .4s;}
  .actor .inner{width:100%;height:100%;animation:breathe 3s ease-in-out infinite;transform-origin:50% 100%}
  .actor.flip .inner svg{transform:scaleX(-1)}
  .actor svg{width:100%;height:100%;overflow:visible}
  .actor.enter{animation:popin .6s cubic-bezier(.3,1.6,.5,1) both}
  .actor.dim{filter:saturate(.85) brightness(.9)}
  .actor.speaking .inner{animation:hop .5s ease-in-out infinite}
  .actor .mouth-talk{display:none}
  .actor.speaking .mouth-idle{display:none}
  .actor.speaking .mouth-talk{display:inline;animation:talk .22s steps(2) infinite}
  .eyes{animation:blink 4s infinite;transform-origin:100px 115px}
  .actor.yin{bottom:290px;width:180px;height:180px}
  .actor.yin .inner{animation:floaty 2.4s ease-in-out infinite}
  .actor.yin.speaking .inner{animation:floaty 1s ease-in-out infinite}
  .actor .tag{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:2px 12px;font-size:17px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .3s}
  .actor.speaking .tag{opacity:1}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
  @keyframes popin{0%{transform:scale(.3) translateY(60px);opacity:0}100%{transform:none;opacity:1}}
  @keyframes talk{0%{transform:scaleY(1)}100%{transform:scaleY(.3)}}
  @keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}

  /* dialog */
  #dialog{position:absolute;left:40px;right:40px;bottom:22px;height:150px;background:rgba(251,243,226,.96);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.35);padding:30px 34px 20px 34px}
  #dialog .name{position:absolute;top:-22px;left:26px;background:var(--red);color:#fff;font-weight:800;font-size:22px;padding:3px 18px;border-radius:12px;border:3px solid var(--ink)}
  #dialog .name.nar{background:var(--jade)}
  #dialog .text{font-size:29px;line-height:1.55;font-weight:500;letter-spacing:.5px}
  #dialog .text em{font-style:normal;color:var(--red);font-weight:800}
  #dialog .next{position:absolute;right:22px;bottom:12px;font-size:20px;animation:nudge 1s infinite;opacity:.7}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

  /* overlays */
  #fader{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
  #fader.in{animation:fadeout 1s ease both}
  @keyframes fadeout{0%{opacity:1}100%{opacity:0}}
  #title{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 50% 45%,rgba(40,25,15,.55),rgba(10,6,4,.9))}
  #title.show{display:flex}
  #title .stop{font-size:30px;color:var(--gold);letter-spacing:8px;animation:rise .8s .1s both}
  #title .big{font-size:84px;font-weight:900;color:#fff;letter-spacing:6px;text-shadow:0 5px 0 var(--red);animation:rise .8s .3s both}
  #title .yr{margin-top:16px;font-size:28px;color:#f0dcb0;animation:rise .8s .55s both}
  @keyframes rise{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:none}}

  #card,#quiz,#recap,#start{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,10,6,.55)}
  #card.show,#quiz.show,#recap.show,#start.show{display:flex}
  .scroll{background:var(--paper);border:5px solid var(--ink);border-radius:20px;box-shadow:0 10px 0 rgba(0,0,0,.4);padding:34px 46px;width:820px;animation:popin .6s cubic-bezier(.3,1.5,.5,1) both;position:relative}
  .scroll h2{font-size:38px;margin-bottom:6px;display:flex;align-items:center;gap:12px}
  .scroll h2 .badge{font-size:20px;background:var(--gold);border:3px solid var(--ink);border-radius:10px;padding:2px 10px}
  .scroll ul{list-style:none;margin-top:14px}
  .scroll li{font-size:28px;line-height:1.5;padding:6px 0 6px 40px;position:relative;animation:rise .5s both}
  .scroll li::before{content:"✦";position:absolute;left:6px;color:var(--red)}
  .scroll li b{color:var(--red)}
  .btn{display:inline-block;margin-top:18px;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:14px;font-size:24px;font-weight:800;padding:8px 26px;cursor:pointer;box-shadow:0 4px 0 var(--ink);font-family:inherit}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .q{font-size:32px;font-weight:800;line-height:1.45;margin:8px 0 14px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .opt{font-family:inherit;text-align:left;font-size:25px;padding:14px 18px;border:3px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;line-height:1.35;transition:transform .15s}
  .opt:hover{transform:translateY(-2px)}
  .opt.right{background:#c9efd6;border-color:#1e7a45;animation:pulse .6s}
  .opt.wrong{background:#f7c9c4;border-color:var(--red)}
  .opt.fade{opacity:.45}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
  .explain{margin-top:14px;font-size:24px;line-height:1.5;background:#fff5cf;border-left:8px solid var(--gold);padding:10px 16px;border-radius:8px;animation:rise .5s both}
  .think{font-size:22px;color:#7a5a3a;margin-top:6px}

  /* top bar */
  #topbar{position:absolute;top:12px;left:16px;right:16px;display:flex;gap:6px;align-items:center;z-index:5}
  .chip{font-size:15px;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.55);border:2px solid rgba(0,0,0,.25);color:#3a2a20;font-weight:700}
  .chip.on{background:var(--gold);border-color:var(--ink)}
  .chip.done{background:#e9dcc0}
  .spacer{flex:1}
  .tbtn{font-family:inherit;font-size:16px;font-weight:700;padding:4px 12px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);cursor:pointer}
  .tbtn.on{background:var(--jade);color:#fff}
  .video #topbar,.video #dialog .next{display:none}

  /* map highlight */
  .region{transition:fill .5s}
  .hl{animation:hlp 1.2s ease-in-out infinite}
  @keyframes hlp{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35) drop-shadow(0 0 10px #fff)}}
  .shake{animation:shake .5s 2}
  @keyframes shake{0%,100%{transform:none}25%{transform:translate(-8px,4px)}75%{transform:translate(8px,-4px)}}
  .twinkle{animation:tw 2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
  .drift{animation:drift 20s linear infinite}
  @keyframes drift{0%{transform:translateX(-200px)}100%{transform:translateX(1400px)}}
  .flick{animation:flick .4s ease-in-out infinite alternate;transform-origin:50% 100%}
  @keyframes flick{0%{transform:scaleY(1) skewX(-3deg)}100%{transform:scaleY(1.15) skewX(3deg)}}
  .snow{animation:snow 6s linear infinite}
  @keyframes snow{0%{transform:translateY(-40px)}100%{transform:translateY(760px)}}
  .wave{animation:wave 3s ease-in-out infinite alternate}
  @keyframes wave{0%{transform:translateX(0)}100%{transform:translateX(-30px)}}
  .flagwave{animation:flagw 1.2s ease-in-out infinite alternate;transform-origin:0 50%}
  @keyframes flagw{0%{transform:skewY(-4deg)}100%{transform:skewY(4deg)}}

  /* recap */
  .grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .cell{border:3px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:17px;line-height:1.4;background:#fff;animation:rise .5s both}
  .cell h4{font-size:20px;margin-bottom:2px;color:var(--red)}
  .cell.mid{background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
  .tl{display:flex;justify-content:space-between;margin-top:12px;font-size:16px;font-weight:700;position:relative}
  .tl::before{content:"";position:absolute;left:0;right:0;top:10px;height:4px;background:var(--ink)}
  .tl div{position:relative;text-align:center;width:16%;padding-top:24px}
  .tl div::before{content:"";position:absolute;left:50%;top:3px;width:18px;height:18px;margin-left:-9px;background:var(--red);border:3px solid var(--ink);border-radius:50%}

  #start .scroll{text-align:center;width:900px}
  #start h1{font-size:62px;letter-spacing:4px;line-height:1.2}
  #start h1 small{display:block;font-size:26px;color:var(--jade);letter-spacing:2px;margin-bottom:6px}
  #start p{font-size:22px;line-height:1.6;margin-top:12px}
  .credit{font-size:15px !important;color:#7a6650;margin-top:14px !important}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="bg" class="layer"></div>
  <div id="actors" class="layer"></div>
  <div id="topbar"></div>
  <div id="dialog"><div class="name">旁白</div><div class="text"></div><div class="next">▼</div></div>
  <div id="title"><div class="stop"></div><div class="big"></div><div class="yr"></div></div>
  <div id="card"></div>
  <div id="quiz"></div>
  <div id="recap"></div>
  <div id="start" class="show"></div>
  <div id="fader"></div>
</div></div>

<script>
/* ================= 角色 ================= */
const C = {
  xiaoan:{name:'阿晃哥',skin:'#ffd9b8',robe:'#3d6fb6',hat:'student'},
  toto:{name:'TOTO',skin:'#f6cfa6',robe:'#e07b2a',hat:'spiky',glasses:true},
  yin:{name:'銀兩君',yin:true},
  abaoji:{name:'耶律阿保機',skin:'#f2c49b',robe:'#8a5a2b',hat:'khitan',beard:true},
  deguang:{name:'耶律德光',skin:'#f2c49b',robe:'#6d4c8a',hat:'khitan'},
  soldier:{name:'將士',skin:'#f4c9a0',robe:'#7b7f86',hat:'helmet'},
  zhao:{name:'宋太祖 趙匡胤',skin:'#f4c9a0',robe:'#e3b11c',hat:'crown',beard:true,prop:'cup'},
  general:{name:'武將',skin:'#f4c9a0',robe:'#8a2e2e',hat:'helmet',beard:true},
  zhenzong:{name:'宋真宗',skin:'#ffe0c2',robe:'#e3b11c',hat:'crown'},
  kouzhun:{name:'寇準',skin:'#f6cfaa',robe:'#b8322a',hat:'wing',beard:true,prop:'scroll'},
  aguda:{name:'完顏阿骨打',skin:'#eebf93',robe:'#2f5d50',hat:'fur',beard:true},
  huizong:{name:'宋徽宗',skin:'#ffe0c2',robe:'#e3b11c',hat:'crown',prop:'brush'},
  qinzong:{name:'宋欽宗',skin:'#ffe0c2',robe:'#d8a62a',hat:'crown',sad:true},
  gaozong:{name:'宋高宗',skin:'#ffe0c2',robe:'#e3b11c',hat:'crown'},
  yuefei:{name:'岳飛',skin:'#f0c093',robe:'#9b2b25',hat:'helmet',prop:'flag'},
};

function charSVG(id){
  const c=C[id];
  if(c.yin) return `<svg viewBox="0 0 200 200">
    <defs><linearGradient id="sg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#cfd6de"/><stop offset="1" stop-color="#8e99a6"/></linearGradient></defs>
    <ellipse cx="100" cy="185" rx="55" ry="8" fill="rgba(0,0,0,.18)"/>
    <path d="M18 92 Q8 70 30 74 Q60 82 100 82 Q140 82 170 74 Q192 70 182 92 Q170 150 100 152 Q30 150 18 92Z" fill="url(#sg${id})" stroke="#4b5560" stroke-width="5"/>
    <ellipse cx="100" cy="76" rx="44" ry="34" fill="url(#sg${id})" stroke="#4b5560" stroke-width="5"/>
    <path d="M70 60 Q80 48 95 50" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <g class="eyes" style="transform-origin:100px 108px"><ellipse cx="78" cy="108" rx="7" ry="9" fill="#222"/><ellipse cx="122" cy="108" rx="7" ry="9" fill="#222"/><circle cx="80" cy="105" r="2.5" fill="#fff"/><circle cx="124" cy="105" r="2.5" fill="#fff"/></g>
    <circle cx="62" cy="122" r="8" fill="#ff9fb0" opacity=".7"/><circle cx="138" cy="122" r="8" fill="#ff9fb0" opacity=".7"/>
    <path class="mouth-idle" d="M90 124 Q100 134 110 124" stroke="#222" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse class="mouth-talk" cx="100" cy="128" rx="9" ry="8" fill="#7a2230" style="transform-origin:100px 128px"/>
    <path d="M20 100 Q2 108 8 124" stroke="#4b5560" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M180 100 Q198 92 192 76" stroke="#4b5560" stroke-width="6" fill="none" stroke-linecap="round"/>
  </svg>`;
  const s=c.skin,r=c.robe;
  let back='',front='',prop='';
  switch(c.hat){
    case 'spiky': front=`<path d="M44 110 L40 70 L58 82 L60 44 L80 66 L94 30 L106 62 L124 34 L130 68 L150 50 L146 84 L162 76 L156 110 Q150 82 124 80 Q100 90 74 82 Q52 86 44 110Z" fill="#5a3a22"/>`;break;
    case 'student': front=`<path d="M45 108 Q44 50 100 48 Q158 50 155 108 Q150 80 128 76 Q110 92 70 84 Q52 90 45 108Z" fill="#2b2420"/>`;break;
    case 'wing': front=`<rect x="-38" y="66" width="276" height="8" rx="4" fill="#1d1d1d"/><path d="M58 80 Q58 30 100 30 Q142 30 142 80Z" fill="#1d1d1d"/><rect x="56" y="72" width="88" height="14" rx="6" fill="#1d1d1d"/>`;break;
    case 'crown': front=`<path d="M52 90 Q50 52 100 50 Q150 52 148 90Z" fill="#1d1d1d"/><rect x="48" y="80" width="104" height="12" rx="5" fill="${'#d9a521'}"/><path d="M70 50 L80 18 L100 40 L120 18 L130 50Z" fill="#d9a521" stroke="#8a6410" stroke-width="3"/><circle cx="100" cy="32" r="6" fill="#c0392b"/>`;break;
    case 'khitan': front=`<path d="M48 96 Q50 50 100 46 Q150 50 152 96 Q130 70 100 70 Q70 70 48 96Z" fill="#7a4e2a"/><rect x="44" y="84" width="112" height="16" rx="8" fill="#f1e6d0"/><path d="M50 110 Q36 140 46 170" stroke="#2b2420" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M150 110 Q164 140 154 170" stroke="#2b2420" stroke-width="9" fill="none" stroke-linecap="round"/>`;break;
    case 'fur': front=`<path d="M46 96 Q46 36 100 36 Q154 36 154 96Z" fill="#4a3a2c"/><path d="M40 92 Q100 70 160 92 L160 106 Q100 86 40 106Z" fill="#e8e1d4"/><circle cx="100" cy="34" r="10" fill="#e8e1d4"/>`;break;
    case 'helmet': front=`<path d="M46 100 Q44 44 100 42 Q156 44 154 100 L140 100 Q138 70 100 68 Q62 70 60 100Z" fill="#9aa3ad" stroke="#4b5560" stroke-width="4"/><rect x="94" y="20" width="12" height="26" fill="#9aa3ad"/><path d="M100 22 Q80 0 92 -6 Q100 6 108 -6 Q120 0 100 22Z" fill="#c0392b"/>`;break;
  }
  if(c.prop==='cup') prop=`<g transform="translate(150,200)"><path d="M0 0 L26 0 L22 22 L4 22Z" fill="#d9a521" stroke="#6b4a10" stroke-width="3"/><rect x="9" y="22" width="8" height="10" fill="#d9a521"/></g>`;
  if(c.prop==='brush') prop=`<g transform="translate(152,150) rotate(20)"><rect x="0" y="0" width="8" height="70" fill="#6b3f1d"/><path d="M-2 70 L10 70 L4 92Z" fill="#222"/></g>`;
  if(c.prop==='scroll') prop=`<g transform="translate(146,196)"><rect x="0" y="0" width="40" height="26" fill="#f3e6c4" stroke="#6b4a10" stroke-width="3"/><rect x="-4" y="-3" width="6" height="32" rx="3" fill="#8a5a2b"/><rect x="38" y="-3" width="6" height="32" rx="3" fill="#8a5a2b"/></g>`;
  if(c.prop==='flag') prop=`<g transform="translate(170,40)"><rect x="0" y="0" width="6" height="250" fill="#5a3a1a"/><g class="flagwave"><path d="M6 6 L76 14 L70 50 L76 86 L6 80Z" fill="#c0392b" stroke="#5a1a14" stroke-width="3"/><text x="38" y="62" font-size="38" font-weight="900" fill="#fff" text-anchor="middle" font-family="Noto Serif CJK TC,serif">岳</text></g></g>`;
  const beard = c.beard?`<path d="M78 142 Q100 176 122 142 Q112 160 100 160 Q88 160 78 142Z" fill="#2b2420"/>`:'';
  const brow = c.sad?`<path d="M68 96 L88 102 M132 96 L112 102" stroke="#2b2420" stroke-width="4" stroke-linecap="round"/>`:'';
  const tear = c.sad?`<path d="M76 128 Q72 138 76 142 Q80 138 76 128Z" fill="#7fc3ff"/>`:'';
  return `<svg viewBox="0 0 200 300">
    <ellipse cx="100" cy="292" rx="70" ry="9" fill="rgba(0,0,0,.2)"/>
    ${back}
    <path d="M62 168 L138 168 L166 290 L34 290Z" fill="${r}" stroke="#2a1f17" stroke-width="4" stroke-linejoin="round"/>
    <path d="M100 168 L84 210 M100 168 L116 210" stroke="#2a1f17" stroke-width="3" fill="none"/>
    <rect x="52" y="226" width="96" height="12" rx="5" fill="rgba(0,0,0,.28)"/>
    <ellipse cx="50" cy="214" rx="16" ry="34" fill="${r}" stroke="#2a1f17" stroke-width="4" transform="rotate(14 50 214)"/>
    <ellipse cx="150" cy="214" rx="16" ry="34" fill="${r}" stroke="#2a1f17" stroke-width="4" transform="rotate(-14 150 214)"/>
    <circle cx="44" cy="244" r="10" fill="${s}" stroke="#2a1f17" stroke-width="3"/>
    <circle cx="156" cy="244" r="10" fill="${s}" stroke="#2a1f17" stroke-width="3"/>
    <circle cx="100" cy="112" r="56" fill="${s}" stroke="#2a1f17" stroke-width="4"/>
    ${front}
    ${brow}
    <g class="eyes"><ellipse cx="80" cy="116" rx="6.5" ry="8.5" fill="#222"/><ellipse cx="120" cy="116" rx="6.5" ry="8.5" fill="#222"/><circle cx="82" cy="113" r="2.4" fill="#fff"/><circle cx="122" cy="113" r="2.4" fill="#fff"/></g>
    <circle cx="66" cy="132" r="8" fill="#ff9f9f" opacity=".55"/><circle cx="134" cy="132" r="8" fill="#ff9f9f" opacity=".55"/>
    ${tear}
    ${c.glasses?'<g fill="none" stroke="#2a1f17" stroke-width="4"><circle cx="80" cy="116" r="15"/><circle cx="120" cy="116" r="15"/><path d="M95 116 L105 116"/></g>':''}
    <path class="mouth-idle" d="${c.sad?'M90 142 Q100 134 110 142':'M90 136 Q100 146 110 136'}" stroke="#222" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse class="mouth-talk" cx="100" cy="140" rx="8" ry="7" fill="#7a2230" style="transform-origin:100px 140px"/>
    ${beard}
    ${prop}
  </svg>`;
}

/* ================= 背景 ================= */
const SKY=(a,b)=>`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="1280" height="720" fill="url(#sky)"/>`;
const clouds=`<g class="drift" opacity=".85"><ellipse cx="0" cy="110" rx="70" ry="24" fill="#fff"/><ellipse cx="50" cy="96" rx="50" ry="26" fill="#fff"/></g><g class="drift" style="animation-delay:-11s" opacity=".7"><ellipse cx="0" cy="180" rx="60" ry="20" fill="#fff"/><ellipse cx="40" cy="168" rx="40" ry="22" fill="#fff"/></g>`;
const BG={
 room:(morning)=>`<svg viewBox="0 0 1280 720">${SKY(morning?'#ffe9c7':'#2b2f4f',morning?'#f7d29a':'#403a5c')}
   <rect x="0" y="470" width="1280" height="250" fill="${morning?'#c79b6d':'#5a4636'}"/>
   <rect x="820" y="80" width="300" height="240" rx="10" fill="${morning?'#bfe4ff':'#141a33'}" stroke="#2a1f17" stroke-width="10"/>
   <line x1="970" y1="80" x2="970" y2="320" stroke="#2a1f17" stroke-width="8"/><line x1="820" y1="200" x2="1120" y2="200" stroke="#2a1f17" stroke-width="8"/>
   ${morning?'<circle cx="900" cy="150" r="34" fill="#ffd34d"/>':'<circle cx="1060" cy="140" r="30" fill="#fff6c9"/><circle cx="1072" cy="132" r="26" fill="#141a33"/><circle class="twinkle" cx="870" cy="120" r="4" fill="#fff"/><circle class="twinkle" style="animation-delay:-1s" cx="920" cy="260" r="3" fill="#fff"/><circle class="twinkle" style="animation-delay:-.5s" cx="1030" cy="250" r="4" fill="#fff"/>'}

function keyOf(it){ return it.type==='line'? `${it.si}_l${it.li}` : it.type==='recap'? 'recap' : `${it.si}_${it.type}`; }
function voLead(it){ return it.type==='title'?0.6:0.25; }
function durOf(it){
  const v=VO[keyOf(it)]||0, lead=voLead(it);
  if(it.type==='title') return Math.max(3.2, lead+v+0.6);
  if(it.type==='line') return v? lead+v+0.6 : 1.6+plain(S[it.si].lines[it.li].t).length*0.16;
  if(it.type==='card') return Math.max(2.5+S[it.si].card.items.length*1.6, lead+v+1.2);
  if(it.type==='quiz') return v? lead+v+4 : 7;
  if(it.type==='reveal') return v? lead+v+1.5 : 6.5;
  if(it.type==='recap') return Math.max(14, lead+v+6);
}

let cur=-1, curBg=null, curCast='', lineStart=0, typing=null, score=0, answered=0, auto=false, tts=true, music=false;

function setBg(key){
  if(key===curBg) return; curBg=key;
  $('#bg').innerHTML = key==='room2'? BG.room(true) : BG[key]();
}
function setCast(cast){
  const sig=JSON.stringify(cast); if(sig===curCast) return;
  const old={}; document.querySelectorAll('.actor').forEach(a=>old[a.dataset.k]=a);
  const keep=new Set();
  cast.forEach(([id,slot,flip],i)=>{
    const k=id+'_'+i; // allow duplicates (general x2)
    let el=old[k];
    if(!el){
      el=document.createElement('div');
      el.className='actor enter'+(C[id].yin?' yin':'');
      el.dataset.k=k; el.dataset.id=id; el.setAttribute('data-local','');
      el.innerHTML=`<div class="inner">${charSVG(id)}</div><div class="tag">${C[id].name}</div>`;
      $('#actors').appendChild(el);
    }
    el.classList.toggle('flip',!!flip || (slot>=3 && !C[id].yin && flip!==false && id!=='xiaoan'));
    el.style.left=SLOTX[slot]+(C[id].yin?25:0)+'px';
    keep.add(k);
  });
  Object.entries(old).forEach(([k,el])=>{if(!keep.has(k)) el.remove();});
  curCast=sig;
}
function castAt(si,li){
  const sc=S[si]; let cast=sc.cast, bg=sc.bg;
  for(let i=0;i<=li;i++){const l=sc.lines[i]; if(l.cast) cast=l.cast; if(l.bg) bg=l.bg;}
  return {cast,bg};
}

    dlg.style.visibility='hidden';
    const q=sc.quiz, rev=it.type==='reveal';
    $('#quiz').innerHTML=`<div class="scroll" ${rev?'':'data-local'}><h2><span class="badge">❓ 隨堂小測驗</span></h2><div class="q">${q.q}</div>
      <div class="opts">${q.o.map((o,k)=>`<button class="opt ${rev?(k===q.a?'right':'fade'):''}" data-k="${k}">${'ABCD'[k]}. ${o}</button>`).join('')}</div>
      ${rev?`<div class="explain" data-local>✅ 答案是 ${'ABCD'[q.a]}！${q.e}</div>`:(VIDEO?'<div class="think">想一想，答案是哪一個？</div>':'')}<div id="qfoot"></div></div>`;
    $('#quiz').classList.add('show');
    if(rev){const r=$('#quiz .opt.right'); r.setAttribute('data-local','');}
    if(!VIDEO){
      speakCur();
      $('#quiz').querySelectorAll('.opt').forEach(b=>b.onclick=e=>{
        e.stopPropagation(); if($('#quiz').dataset.done==='1') return;
        $('#quiz').dataset.done='1'; const k=+b.dataset.k; answered++;
        $('#quiz').querySelectorAll('.opt').forEach(x=>{const kk=+x.dataset.k; if(kk===q.a)x.classList.add('right'); else if(kk===k)x.classList.add('wrong'); else x.classList.add('fade');});
        const ok=k===q.a; if(ok){score++;ding(true);}else ding(false);
        $('#qfoot').innerHTML=`<div class="explain">${ok?'🎉 答對了！':'😅 差一點！答案是 '+'ABCD'[q.a]+'。'}${q.e}</div><button class="btn" id="qNext">繼續 ▶</button>`;
        speak(it.si+'_reveal');
        $('#qNext').onclick=ev=>{ev.stopPropagation();next();};
      });
      $('#quiz').dataset.done='0';
    }
  }
  if(it.type==='recap'){
    dlg.style.visibility='hidden'; setBg('room2'); setCast([['xiaoan',0],['yin',4],['toto',5]]);
    document.querySelectorAll('.actor').forEach(a=>a.classList.remove('speaking','dim'));
    const g=[
      ['前言','10～12世紀，多民族多國家並立'],['五代與遼','契丹耶律阿保機建國；耶律德光取得燕雲十六州'],['北宋特質','趙匡胤陳橋兵變、杯酒釋兵權；文人政治'],
      ['結語','經濟強、武力弱；岳飛為何不受支持？'],null,['宋的鄰國','遼、西夏、高麗，後有金'],
      ['靖康之禍','1127汴京陷落，北宋亡；南宋定都臨安'],['聯金滅遼','徽宗聯金滅遼，歲幣改給金，暴露弱點'],['澶淵之盟','1004兄弟之邦、歲幣銀絹、百年和平'],
    ];
    $('#recap').innerHTML=`<div class="scroll" style="width:1000px;padding:24px 34px" data-local><h2><span class="badge">🧠 總複習</span>宋遼金九宮格</h2>
      <div class="grid9">${g.map((c,k)=>c?`<div class="cell" data-local style="animation-delay:${.3+k*.25}s"><h4>${c[0]}</h4>${c[1]}</div>`:`<div class="cell mid" data-local>宋遼金</div>`).join('')}</div>
      <div class="tl"><div>960<br>北宋建立</div><div>1004<br>澶淵之盟</div><div>1115<br>金建國</div><div>1125<br>遼亡</div><div>1127<br>靖康之禍</div><div>南宋<br>南北對峙</div></div>
      ${VIDEO?'':`<div style="text-align:center"><span style="font-size:22px;font-weight:800">測驗成績：${score} / ${answered}　</span><button class="btn" id="again">↺ 再看一次</button></div>`}</div>`;
    $('#recap').classList.add('show');
    if(!VIDEO) $('#again').onclick=e=>{e.stopPropagation();score=0;answered=0;curBg=null;curCast='';show(0);};
  }
}

/* typing */
function typeTo(n){
  const it=TL[cur]; if(!it||it.type!=='line') return;
  const html=S[it.si].lines[it.li].t;
  // reveal n visible chars while preserving tags
  let out='',cnt=0,i=0;
  while(i<html.length && cnt<n){ if(html[i]==='<'){const j=html.indexOf('>',i);out+=html.slice(i,j+1);i=j+1;} else {out+=html[i];i++;cnt++;} }
  // close open em
  const opens=(out.match(/<em>/g)||[]).length-(out.match(/<\/em>/g)||[]).length; if(opens>0) out+='</em>';
  $('#dialog .text').innerHTML=out;
  $('#dialog .next').style.visibility = cnt>=plain(html).length?'visible':'hidden';
  return cnt>=plain(html).length;
}
const CPS=22;
function startTyping(){
  cancelAnimationFrame(typing);
  const step=()=>{const done=typeTo(Math.floor((performance.now()-lineStart)/1000*CPS)); if(!done) typing=requestAnimationFrame(step);};
  step();
}
function lineDone(){const it=TL[cur]; return it.type!=='line' || typeTo(1e9);}

let autoTimer=null;
function scheduleAuto(){
  clearTimeout(autoTimer); if(!auto || VIDEO) return;
  const it=TL[cur]; if(it.type==='quiz'||it.type==='recap') return;
  if(tts && VO[keyOf(it)]) return; // 配音播完會自動前進
  autoTimer=setTimeout(next, durOf(it)*1000);
}
function next(){ if(cur<TL.length-1) show(cur+1); }
stage.addEventListener('click',()=>{
  if(VIDEO||cur<0) return; const it=TL[cur];
  if(it.type==='line'){ const done=(performance.now()-lineStart)/1000*CPS >= plain(S[it.si].lines[it.li].t).length; if(!done){lineStart=-1e9;typeTo(1e9);return;} next(); }
  else if(it.type==='title') next();
});
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowRight'||e.code==='Enter'){ e.preventDefault(); const it=TL[cur]; if(it && (it.type==='line'||it.type==='title')) stage.click(); else if(it && it.type==='card') next(); }});

/* TTS */
const voice=new Audio();
function stopVoice(){ try{voice.pause();}catch(e){} voice.onended=null; }
function speak(key,onend){
  if(!tts||VIDEO) return;
  stopVoice(); if(!VO[key]) return;
  voice.src='audio/'+key+'.mp3'; voice.onended=()=>{onend&&onend();};
  voice.play().catch(()=>{});
}
function speakCur(){
  const it=TL[cur]; if(!it) return;
  if(it.type==='quiz'||it.type==='recap'){ speak(keyOf(it)); return; }
  speak(keyOf(it),()=>{ if(auto && TL[cur]===it) autoTimer=setTimeout(next,600); });
}

/* Web Audio 背景音樂 & 音效 */
let actx=null, musicTimer=null;
function ac(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function pluck(f,t,vol=.12,len=1.6){const a=ac();const o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain();o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);o2.connect(g);g.connect(a.destination);o.start(t);o2.start(t);o.stop(t+len);o2.stop(t+len);}
const PENTA=[293.66,329.63,369.99,440,493.88,587.33,659.25,739.99];
function startMusic(){ const a=ac(); a.resume(); let n=0; const tick=()=>{ const t=a.currentTime+.05; const seq=[0,2,4,5,4,2,3,1, 0,2,4,7,5,4,2,0]; const k=seq[n%16]; pluck(PENTA[k],t,.07); if(n%4===0) pluck(PENTA[0]/2,t,.05,2.4); n++; }; tick(); musicTimer=setInterval(tick,520); }
function stopMusic(){ clearInterval(musicTimer); }
function ding(ok){ try{const a=ac();a.resume();const t=a.currentTime; if(ok){pluck(659.25,t,.2,.6);pluck(987.77,t+.12,.2,.8);} else {pluck(220,t,.18,.5);pluck(196,t+.15,.18,.6);} }catch(e){} }

/* 開始畫面 */
$('#start').innerHTML=`<div class="scroll"><h1><small>國中歷史互動動畫故事</small>銀兩君的時空帳本</h1>
  <p>跟著阿晃哥、TOTO 和會說話的歲幣「銀兩君」，穿越回<b>宋、遼、金</b>多民族多國家的時代！<br>點畫面或按空白鍵繼續，每一站結束都有歷史小卡和隨堂小測驗。</p>
  <button class="btn" id="go" style="font-size:30px;padding:10px 40px">開始冒險 ▶</button>
  <p class="credit">內容依據：「不消失的歷史課」H3-012〈多民族多國家的宋遼金〉課程重點整理改編</p></div>`;
if(!VIDEO){
  setBg('room');
  $('#go').onclick=e=>{e.stopPropagation(); try{ac().resume();}catch(_){} show(0);};
}

/* ====== 影片錄製用 API ====== */
window.__TL=()=>TL.map(it=>({type:it.type,si:it.si,dur:durOf(it)}));
window.__show=i=>{ show(i); };
window.__tick=(tItem,tScene)=>{
  const it=TL[cur];
  if(it.type==='line'){
    const v=VO[keyOf(it)], n=plain(S[it.si].lines[it.li].t).length;
    const cps = v? Math.max(n/(v*0.9), 6) : CPS;
    typeTo(Math.floor(Math.max(0,tItem-(v?voLead(it):0.15))*cps));
  }
  document.getAnimations().forEach(a=>{
    a.pause();
    const el=a.effect&&a.effect.target;
    const local= el && el.closest && el.closest('[data-local]');
    a.currentTime=(local? tItem : tScene)*1000;
  });
};
